# Weekly read-only health report on the listings data: dead or moved websites,
# and listings due a freshness review. See scripts/check-listings.mjs.
name: Listings health report

on:
  schedule:
    - cron: "47 12 * * 1" # Mondays, ~8:47am New York
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The site's own VITE_SUPABASE_ANON_KEY: the project's publishable key,
      # which ships in every page's JavaScript and can only read what anon is
      # granted. Not a secret.
      VITE_SUPABASE_URL: https://cntafkasuhnpdlhdwajm.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_rV-JfhGjoG1s0XEu4_7Mog_Ct2bVLeI
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-listings.mjs --out listings-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: listings-report
          path: listings-report.md
          if-no-files-found: ignore
