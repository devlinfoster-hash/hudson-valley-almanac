<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CC4ZRHVJDQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // send_page_view disabled here; the SPA sends page_view on every
      // React Router location change (including the initial load) in App.jsx.
      gtag('config', 'G-CC4ZRHVJDQ', { send_page_view: false });
    </script>
    <!-- Per-page title, description, canonical, and Open Graph / Twitter tags are
         rendered at build time by react-helmet (vite-react-ssg Head) into each
         prerendered page, and on the client for any non-prerendered route. Do NOT
         hardcode a title, description, canonical, or per-page OG tag here:
         react-helmet does not de-duplicate against static template tags, so a
         hardcoded one ships ALONGSIDE the per-page one on every URL — which is
         exactly how the generic description leaked into search snippets. Only the
         og:image dimensions below (a constant hint for the constant image, which
         Helmet also emits with the same URL) are kept here. -->
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- No static page title here: it's rendered at build time by react-helmet
         (and client-side for non-prerendered routes), so a static one would
         just duplicate it on every prerendered page. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
